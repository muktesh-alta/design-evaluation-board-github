name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp this commit into asset URLs and version.json so browsers never run stale code.
      - name: Stamp build version
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=$V/g; s/window.DEB_BUILD = \"dev\"/window.DEB_BUILD = \"$V\"/" index.html
          printf '{"build":"%s"}\n' "$V" > version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
